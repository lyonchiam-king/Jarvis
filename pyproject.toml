[project]
name = "jarvis"
version = "0.1.0"
description = "Personal consultant: a mastermind of virtual mentors built from the public work of people you want to learn from."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "yt-dlp>=2024.10.0",
    "youtube-transcript-api>=0.6.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
