[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-outreach"
version = "0.1.0"
description = "Region-agnostic lead discovery and outreach pipeline for SMEs without websites"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.120.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
    "anthropic>=0.69.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "responses>=0.25.0",
]

[project.scripts]
outreach = "outreach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The built React page is data, not code, so `packages.find` does not see it
# and an installed copy would serve /app from a directory that is not there.
# Locally that never showed: the repo is the working directory and the files
# are simply on disk beside the module. In a container, where the package is
# installed rather than run from the checkout, the page would 404 with
# nothing in the log to explain it.
[tool.setuptools.package-data]
outreach = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
