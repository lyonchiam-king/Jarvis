# Campaign: Penang, Malaysia -- hair salons without a website.
# To target a different city/country, copy this file, change `campaign` and
# `compliance.country_code`, and point CAMPAIGN_CONFIG at the new file.
# No code changes required.

campaign:
  name: penang-hair-salons
  category: "hair salon"
  # Free-text location. Places Text Search resolves this, so anything a human
  # would type into Google Maps works: a suburb, a city, or a whole region.
  # Used for copy ("a hair salon in Georgetown") and as the fallback search
  # when no `areas` are listed below.
  location: "Georgetown, Penang, Malaysia"
  language: en
  # Google returns at most ~60 results for any one text search, however you
  # paginate. So one area is a finite well: once discovery has taken those, it
  # will find nothing new there however often you run it.
  #
  # These are the wells, drunk in order. Discovery skips every business already
  # on your Sheet, so each run moves further down this list -- that is what
  # makes "60 today, 60 more tomorrow" actually deliver 60 *new* businesses.
  #
  # When runs start reporting "every area is used up", add more areas here or
  # change the category. Both are one-line edits.
  areas:
    - "Georgetown, Penang, Malaysia"
    - "Pulau Tikus, Penang, Malaysia"
    - "Tanjung Tokong, Penang, Malaysia"
    - "Tanjung Bungah, Penang, Malaysia"
    - "Batu Ferringhi, Penang, Malaysia"
    - "Air Itam, Penang, Malaysia"
    - "Jelutong, Penang, Malaysia"
    - "Gelugor, Penang, Malaysia"
    - "Bayan Baru, Penang, Malaysia"
    - "Bayan Lepas, Penang, Malaysia"
    - "Sungai Ara, Penang, Malaysia"
    - "Balik Pulau, Penang, Malaysia"
    - "Butterworth, Penang, Malaysia"
    - "Perai, Penang, Malaysia"
    - "Seberang Jaya, Penang, Malaysia"
    - "Bukit Mertajam, Penang, Malaysia"
    - "Simpang Ampat, Penang, Malaysia"
    - "Nibong Tebal, Penang, Malaysia"

# One cap for every stage. `run discovery` and `run research` each process at
# most this many businesses per invocation; run the command again for the next
# batch. Bounded runs are what make the pipeline resumable.
#
# 60 is a day's work: 60 new businesses found, researched, and turned into
# prompts, which is about as many demo sites as one person can review.
limits:
  batch_size: 60

discovery:
  # Discovery stops at the tighter of this and limits.batch_size.
  max_results: 60
  # Places API (New) caps Text Search at 20 per page.
  page_size: 20
  # Skip low-signal listings. 0 disables the filter.
  min_rating: 0.0
  min_review_count: 3
  # Only chase businesses that are actually trading.
  allowed_business_status:
    - OPERATIONAL
  # A Facebook page is not a website. When true, a lead whose only web presence
  # is a social/link-in-bio URL still counts as "no website" -- these are often
  # the best leads, since they have proven they want an online presence.
  treat_social_as_no_website: true
  social_domains:
    - facebook.com
    - fb.com
    - fb.me
    - instagram.com
    - linktr.ee
    - linktree.com
    - wa.me
    - api.whatsapp.com
    - tiktok.com
    - x.com
    - twitter.com
    - beacons.ai
    - carrd.co
    - business.site      # Google Business Profile auto-sites
    - shopee.com.my
    - lazada.com.my

research:
  # Which model writes the briefs, and where it runs.
  #   anthropic          Anthropic's API (the default)
  #   ollama             Ollama on this machine -- no API key needed
  #   ollama-cloud       ollama.com -- needs OLLAMA_API_KEY in .env
  #   openrouter         openrouter.ai -- needs OPENROUTER_API_KEY
  #   gemini             Google AI Studio -- needs GEMINI_API_KEY
  #   openai-compatible  anything else speaking that API; set base_url
  #
  # Only Anthropic *guarantees* the reply matches the required shape. On the
  # others the reply is checked, retried once, and the lead is skipped if it
  # still doesn't fit -- see the Errors tab. Try a new model on 5 leads first.
  provider: anthropic
  # e.g. kimi-k2.6 on ollama-cloud, moonshotai/kimi-k2-thinking on openrouter,
  # gemini-2.5-flash on gemini.
  model: claude-opus-5
  # base_url: ""   # override the provider's endpoint (a LAN Ollama box, say)
  #
  # Effort is the cost/latency dial and is Anthropic-only -- it is not sent to
  # other providers. `medium` is strong for summarising reviews into a brief;
  # raise to `high` if briefs read thin.
  effort: medium
  # How many Google reviews to feed the model per business. Raw review text is
  # summarised and then discarded -- never written to the Sheet.
  max_reviews: 8
  social_lookup: true
  email_discovery: true
  request_timeout: 15.0
  # Write partial results to the Sheet every N leads, so an interrupted run
  # never redoes completed work.
  checkpoint_every: 10
  # Within the socials-first split, what order to work in.
  #   sheet    the order they already sit in -- which is Google's own
  #            relevance ranking, and the order you can see. Predictable.
  #   reviews  most-reviewed first. Reviews are what a brief is built from,
  #            so briefs come out richer -- but the queue stops following
  #            the Sheet and looks random unless you are watching that column.
  order: sheet

outreach:
  sender_name: "Lyon Chiam"
  sender_title: "Founder"
  company: "COAI"
  # REQUIRED before Stage 5 will run. Goes in the footer of every draft --
  # a real postal address is a legal requirement for commercial email under
  # CAN-SPAM, GDPR/ePrivacy, and Australia's Spam Act.
  postal_address: "COAI, Level 16, Hunza Tower, Penang, Malaysia"
  # Places rarely returns email for these businesses, so WhatsApp leads.
  channel_priority:
    - whatsapp
    - email
  # The demo site IS the pitch. A business that has never had a website cannot
  # picture one, so a link to theirs does what no sentence can. With this on,
  # no message is drafted until that lead's site exists -- the email is never
  # sent without the thing that makes it worth reading.
  require_site: true

lovable:
  # Only affects the local pipeline's own build path, which cannot work:
  # Lovable is OAuth-only and issues no headless credential. Building happens
  # through Claude Code with the Lovable MCP connector -- see
  # .claude/skills/build-sites/SKILL.md -- so this stays false.
  enabled: false
  require_confirmation: true
  # Off: every prompt waits for you in the dashboard's review queue, where you
  # read it and press Approve or Skip. Approving is one click, and it is the
  # only place a human sees the brief before credits are spent -- worth the
  # ten seconds per lead.
  auto_approve: false

build:
  # Which pipeline builds the demo site.
  #   lovable   the OAuth/MCP path above -- the one running today.
  #   firebase  fully automated: Gemini writes one self-contained HTML file
  #             per lead, Firebase Hosting serves it. No human in the loop.
  target: lovable
  # Separate from lovable.enabled on purpose -- flipping build.target to
  # firebase must not silently start spending Gemini credits on its own.
  enabled: false
  # provider: gemini
  # model: gemini-3-flash
  # output_dir: sites
  # public_base_url: ""   # e.g. https://your-site.web.app, for the outreach draft

compliance:
  # ISO 3166-1 alpha-2. Drives the outreach-law gate in compliance.py.
  country_code: MY
  # Must be true before any outreach stage will run in a flagged jurisdiction.
  # Malaysia is not flagged, so discovery runs regardless.
  acknowledged: false
